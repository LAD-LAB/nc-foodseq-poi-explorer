name: Scrape Grocery Prices

on:
  schedule:
    # Runs every Monday at 6 AM UTC (2 AM EST)
    - cron: '0 6 * * 1'
  workflow_dispatch:
    # Allows manual trigger from GitHub Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: healthmap

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests python-dotenv playwright
          playwright install chromium

      - name: Create .env file
        run: |
          echo "KROGER_CLIENT_ID=${{ secrets.KROGER_CLIENT_ID }}" > .env
          echo "KROGER_CLIENT_SECRET=${{ secrets.KROGER_CLIENT_SECRET }}" >> .env

      - name: Run price scraper
        run: python -u scripts/scrape_prices.py

      - name: Commit and push updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git diff --staged --quiet || git commit -m "Auto-update grocery prices ($(date -u +%Y-%m-%d))"
          git push
